plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.sostrigger'
version = '0.1.0'

android {
  namespace "expo.modules.sostrigger"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles 'proguard-rules.pro'
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.17.0'
  // Offline speech recognition + x-vector speaker model (Apache-2.0). Brings JNA as an AAR.
  implementation 'com.alphacephei:vosk-android:0.3.75@aar'
  implementation 'net.java.dev.jna:jna:5.18.1@aar'

  testImplementation 'junit:junit:4.13.2'
  // android.jar only ships org.json stubs; unit tests need the real implementation.
  testImplementation 'org.json:json:20250517'
}
